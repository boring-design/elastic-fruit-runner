syntax = "proto3";

package controlplane.v1;

option go_package = "github.com/boring-design/elastic-fruit-runner/gen/controlplane/v1;controlplanev1";

import "google/protobuf/timestamp.proto";

service ControlPlaneService {
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);

  rpc SetupAdmin(SetupAdminRequest) returns (SetupAdminResponse);

  rpc Login(LoginRequest) returns (LoginResponse);

  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // GetServiceInfo returns the daemon's identity and configuration.
  // These values are immutable for the lifetime of the process.
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);

  rpc GetDashboardSummary(GetDashboardSummaryRequest) returns (GetDashboardSummaryResponse);

  // ListRunnerSets returns all runner sets with their configuration,
  // GitHub connection state, and live runner instances.
  rpc ListRunnerSets(ListRunnerSetsRequest) returns (ListRunnerSetsResponse);

  // ListJobRecords returns a bounded history of job executions
  // across all runner sets, ordered most-recent-first.
  rpc ListJobRecords(ListJobRecordsRequest) returns (ListJobRecordsResponse);

  rpc GetJobDetail(GetJobDetailRequest) returns (GetJobDetailResponse);

  rpc GetJobLogs(GetJobLogsRequest) returns (GetJobLogsResponse);

  rpc GetJobResourceSamples(GetJobResourceSamplesRequest) returns (GetJobResourceSamplesResponse);

  rpc GetHostResourceSamples(GetHostResourceSamplesRequest) returns (GetHostResourceSamplesResponse);

  // GetMachineVitals returns a point-in-time snapshot of host-level
  // resource metrics (CPU, memory, disk, temperature).
  rpc GetMachineVitals(GetMachineVitalsRequest) returns (GetMachineVitalsResponse);

  rpc GetConfigStatus(GetConfigStatusRequest) returns (GetConfigStatusResponse);

  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);

  rpc SaveConfig(SaveConfigRequest) returns (SaveConfigResponse);

  rpc ListConfigRevisions(ListConfigRevisionsRequest) returns (ListConfigRevisionsResponse);

  rpc RestoreConfigRevision(RestoreConfigRevisionRequest) returns (RestoreConfigRevisionResponse);

  rpc GetSystemInfo(GetSystemInfoRequest) returns (GetSystemInfoResponse);
}

// Authentication

message GetSessionRequest {}

message GetSessionResponse {
  bool setup_required = 1;
  bool authenticated = 2;
  string csrf_token = 3;
}

message SetupAdminRequest {
  string setup_code = 1;
  string password = 2;
}

message SetupAdminResponse {
  string csrf_token = 1;
}

message LoginRequest {
  string password = 1;
}

message LoginResponse {
  string csrf_token = 1;
}

message LogoutRequest {}

message LogoutResponse {}

// ---------------------------------------------------------------------------
// GetServiceInfo
// ---------------------------------------------------------------------------

message GetServiceInfoRequest {}

message GetServiceInfoResponse {
  // Go build metadata embedded in the daemon binary.
  BuildInfo build_info = 1;
  // When the daemon process started.
  google.protobuf.Timestamp started_at = 2;
  // Configured idle runner timeout in seconds.
  int32 idle_timeout_seconds = 3;
}

message GetDashboardSummaryRequest {}

message GetDashboardSummaryResponse {
  int32 runner_set_count = 1;
  int32 preparing_runner_count = 2;
  int32 idle_runner_count = 3;
  int32 busy_runner_count = 4;
  int32 running_job_count = 5;
  int32 failed_job_count = 6;
  int32 completed_job_count = 7;
  bool github_connected = 8;
}

message BuildInfo {
  // Go toolchain version used to build the binary.
  string go_version = 1;
  // Main package path.
  string path = 2;
  // Main module.
  Module main = 3;
  // Dependency modules.
  repeated Module deps = 4;
  // Build settings such as VCS metadata.
  repeated BuildSetting settings = 5;
}

message Module {
  string path = 1;
  string version = 2;
  string sum = 3;
  Module replace = 4;
}

message BuildSetting {
  string key = 1;
  string value = 2;
}

// ---------------------------------------------------------------------------
// ListRunnerSets
// ---------------------------------------------------------------------------

message ListRunnerSetsRequest {}

message ListRunnerSetsResponse {
  repeated RunnerSet runner_sets = 1;
}

enum Backend {
  BACKEND_UNSPECIFIED = 0;
  BACKEND_TART = 1;
  BACKEND_DOCKER = 2;
}

message RunnerSet {
  // Unique runner set identifier (e.g. "macos-tart-arm64").
  string name = 1;
  // Execution backend type.
  Backend backend = 2;
  // VM or container image URI.
  string image = 3;
  // GitHub runner labels.
  repeated string labels = 4;
  // Maximum runner capacity for this set.
  int32 max_runners = 5;
  // GitHub scope (e.g. "org: acme-corp" or "repo: owner/repo").
  string scope = 6;
  // Whether this set's listener is connected to the GitHub Scale Set API.
  // Each set has an independent connection.
  bool connected = 7;
  // Currently tracked runner instances.
  repeated Runner runners = 8;
}

enum RunnerState {
  RUNNER_STATE_UNSPECIFIED = 0;
  RUNNER_STATE_PREPARING = 1;
  RUNNER_STATE_IDLE = 2;
  RUNNER_STATE_BUSY = 3;
}

message Runner {
  // Unique runner instance name (e.g. "macos-tart-arm64-a3f2c").
  string name = 1;
  // Current lifecycle state.
  RunnerState state = 2;
  // When the runner entered the current state.
  google.protobuf.Timestamp since = 3;
}

// ---------------------------------------------------------------------------
// ListJobRecords
// ---------------------------------------------------------------------------

message ListJobRecordsRequest {
  string status = 1;
  string runner_set = 2;
  string repository = 3;
  string workflow = 4;
  optional google.protobuf.Timestamp from = 5;
  optional google.protobuf.Timestamp to = 6;
  string cursor = 7;
  int32 page_size = 8;
}

message ListJobRecordsResponse {
  repeated JobRecord job_records = 1;
  string next_cursor = 2;
}

enum JobResult {
  JOB_RESULT_UNSPECIFIED = 0;
  JOB_RESULT_RUNNING = 1;
  JOB_RESULT_SUCCESS = 2;
  JOB_RESULT_FAILURE = 3;
  JOB_RESULT_CANCELED = 4;
}

message JobRecord {
  // Unique job identifier from GitHub.
  string id = 1;
  // Name of the runner that executed (or is executing) this job.
  string runner_name = 2;
  // Name of the runner set the runner belongs to.
  string runner_set_name = 3;
  // Current result / outcome.
  JobResult result = 4;
  // When the job started.
  google.protobuf.Timestamp started_at = 5;
  // When the job finished. Absent if still running.
  optional google.protobuf.Timestamp completed_at = 6;
  string owner = 7;
  string repository = 8;
  string workflow_ref = 9;
  string display_name = 10;
  int64 workflow_run_id = 11;
  string event_name = 12;
  repeated string labels = 13;
  optional google.protobuf.Timestamp queued_at = 14;
  optional google.protobuf.Timestamp scale_set_assigned_at = 15;
  optional google.protobuf.Timestamp runner_assigned_at = 16;
  Backend backend = 17;
  string actions_url = 18;
}

message GetJobDetailRequest {
  string id = 1;
}

message GetJobDetailResponse {
  JobRecord job = 1;
}

message GetJobLogsRequest {
  string job_id = 1;
  int64 after_sequence = 2;
  int32 page_size = 3;
}

message JobLogLine {
  int64 sequence = 1;
  google.protobuf.Timestamp recorded_at = 2;
  string text = 3;
}

message GetJobLogsResponse {
  repeated JobLogLine lines = 1;
  int64 next_sequence = 2;
}

enum ResourceAccuracy {
  RESOURCE_ACCURACY_UNSPECIFIED = 0;
  RESOURCE_ACCURACY_EXACT = 1;
  RESOURCE_ACCURACY_ESTIMATE = 2;
}

message ResourceSample {
  google.protobuf.Timestamp recorded_at = 1;
  string source = 2;
  ResourceAccuracy accuracy = 3;
  double cpu_percent = 4;
  int64 memory_used_bytes = 5;
  int64 memory_available_bytes = 6;
  int64 disk_used_bytes = 7;
  int64 disk_available_bytes = 8;
  int64 disk_read_bytes = 9;
  int64 disk_write_bytes = 10;
  int64 network_receive_bytes = 11;
  int64 network_send_bytes = 12;
  double load_one = 13;
  double temperature_celsius = 14;
}

message GetJobResourceSamplesRequest {
  string job_id = 1;
}

message GetJobResourceSamplesResponse {
  repeated ResourceSample samples = 1;
}

message GetHostResourceSamplesRequest {
  optional google.protobuf.Timestamp from = 1;
  optional google.protobuf.Timestamp to = 2;
}

message GetHostResourceSamplesResponse {
  repeated ResourceSample samples = 1;
  optional google.protobuf.Timestamp earliest_at = 2;
}

// ---------------------------------------------------------------------------
// GetMachineVitals
// ---------------------------------------------------------------------------

message GetMachineVitalsRequest {}

message GetMachineVitalsResponse {
  // Host CPU utilization (0–100).
  float cpu_usage_percent = 1;
  // Host memory utilization (0–100).
  float memory_usage_percent = 2;
  // Host disk utilization (0–100).
  float disk_usage_percent = 3;
  // CPU/SoC core temperature in Celsius.
  float temperature_celsius = 4;
}

// Config status

enum ConfigSyncState {
  CONFIG_SYNC_STATE_UNSPECIFIED = 0;
  CONFIG_SYNC_STATE_IN_SYNC = 1;
  CONFIG_SYNC_STATE_RESTART_REQUIRED = 2;
  CONFIG_SYNC_STATE_DISK_INVALID = 3;
}

message GetConfigStatusRequest {}

message GetConfigStatusResponse {
  string path = 1;
  string active_hash = 2;
  string disk_hash = 3;
  ConfigSyncState state = 4;
  optional google.protobuf.Timestamp disk_modified_at = 5;
  google.protobuf.Timestamp active_loaded_at = 6;
  repeated string validation_errors = 7;
  string active_yaml = 8;
  string disk_yaml = 9;
  repeated string restart_commands = 10;
}

message ConfigValidationIssue {
  string path = 1;
  string message = 2;
}

message ValidateConfigRequest {
  string yaml = 1;
}

message ValidateConfigResponse {
  repeated ConfigValidationIssue errors = 1;
  repeated ConfigValidationIssue warnings = 2;
  string normalized_yaml = 3;
}

message SaveConfigRequest {
  string yaml = 1;
  bool confirm_warnings = 2;
}

message SaveConfigResponse {
  ValidateConfigResponse validation = 1;
  GetConfigStatusResponse status = 2;
}

message ConfigRevision {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  string source = 3;
  string config_hash = 4;
}

message ListConfigRevisionsRequest {}

message ListConfigRevisionsResponse {
  repeated ConfigRevision revisions = 1;
}

message RestoreConfigRevisionRequest {
  int64 id = 1;
}

message RestoreConfigRevisionResponse {
  GetConfigStatusResponse status = 1;
}

// System information

message GetSystemInfoRequest {}

message GetSystemInfoResponse {
  string os = 1;
  string arch = 2;
  string go_version = 3;
  string database_path = 4;
  int64 database_size_bytes = 5;
}
