name: ast-grep ratchet

on:
  pull_request:

permissions:
  contents: read

jobs:
  ast-grep-ratchet:
    name: ast-grep ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ast-grep 0.51.1
        run: npm i -g @ast-grep/cli@0.51.1 && ast-grep --version

      - name: Legacy-pattern counts must not rise
        run: .ast-grep/ratchet.sh origin/${{ github.base_ref }}
