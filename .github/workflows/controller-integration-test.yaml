name: Integration Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  integration-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Integration Test (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PAT
            runs-on: [self-hosted, linux, arm64]
            features: ../../features/config,../../features/binpath,../../features/jobstore,../../features/vitals,../../features/management
            needs-app-key: false
          - name: GitHub App
            runs-on: [self-hosted, linux, arm64]
            features: ../../features/config,../../features/binpath,../../features/jobstore,../../features/vitals,../../features/management
            needs-app-key: true
          - name: Tart
            runs-on: [self-hosted, macos, arm64, tart-host]
            features: ../../features/tart
            needs-app-key: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Build dashboard (required for go:embed)
        run: cd dashboard && pnpm install --frozen-lockfile && pnpm run build

      - name: Check Tart integration dependencies
        if: matrix.name == 'Tart'
        run: |
          if [ -x /opt/homebrew/bin/brew ]; then
            brew_bin=/opt/homebrew/bin/brew
          elif [ -x /usr/local/bin/brew ]; then
            brew_bin=/usr/local/bin/brew
          else
            echo "::error::Homebrew is required for Tart integration tests"
            exit 1
          fi

          brew_prefix="$("$brew_bin" --prefix)"
          echo "$brew_prefix/bin" >> "$GITHUB_PATH"

          for tool in tart sshpass gpg; do
            tool_path="$brew_prefix/bin/$tool"
            if [ ! -x "$tool_path" ]; then
              echo "::error::Required Tart integration tool is missing: path=$tool_path"
              exit 1
            fi
          done

          "$brew_prefix/bin/tart" --version
          "$brew_prefix/bin/sshpass" -V
          "$brew_prefix/bin/gpg" --version

          tart_keychain="$RUNNER_TEMP/tart-login.keychain"
          rm -f "$tart_keychain" "$tart_keychain-db"
          security create-keychain -p '' "$tart_keychain"
          security unlock-keychain -p '' "$tart_keychain"
          security set-keychain-settings -lut 21600 "$tart_keychain"
          security list-keychains -d user -s "$tart_keychain"
          security default-keychain -s "$tart_keychain"

          if sudo -n true 2>/dev/null; then
            sudo defaults write /Library/Preferences/SystemConfiguration/com.apple.InternetSharing.default.plist bootpd -dict DHCPLeaseTimeSecs -int 600
            sudo rm -f /var/db/dhcpd_leases
          else
            echo "::warning::Passwordless sudo is unavailable; skipping Tart DHCP cleanup"
          fi

      - name: Write GitHub App private key
        if: matrix.needs-app-key
        run: |
          echo "${{ secrets.EFR_TEST_APP_PRIVATE_KEY }}" > /tmp/efr-test-app-key.pem

      # The PAT and workflow dispatch steps use a short lived installation
      # token of the test GitHub App instead of a personal token that expires.
      - name: Mint GitHub App installation token
        if: matrix.name != 'Tart'
        env:
          APP_CLIENT_ID: ${{ secrets.EFR_TEST_APP_CLIENT_ID }}
          APP_INSTALLATION_ID: ${{ secrets.EFR_TEST_APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.EFR_TEST_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/efr-test-app-mint.pem"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$APP_CLIENT_ID" | b64url)
          signature=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key" | b64url)
          rm -f "$key"
          token=$(curl -fsS -X POST \
            -H "Authorization: Bearer $header.$payload.$signature" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$APP_INSTALLATION_ID/access_tokens" | jq -r .token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Could not mint an installation token for installation $APP_INSTALLATION_ID"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "EFR_TEST_INSTALLATION_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run integration tests
        env:
          EFR_TEST_CONFIG_URL: ${{ vars.EFR_TEST_CONFIG_URL }}
          EFR_TEST_WORKFLOW_ORG: ${{ vars.EFR_TEST_WORKFLOW_ORG }}
          EFR_TEST_WORKFLOW_REPO: ${{ vars.EFR_TEST_WORKFLOW_REPO }}
          EFR_TEST_WORKFLOW_FILE: ${{ vars.EFR_TEST_WORKFLOW_FILE }}
          EFR_TEST_WORKFLOW_TOKEN: ${{ env.EFR_TEST_INSTALLATION_TOKEN }}
          EFR_TEST_PAT: ${{ env.EFR_TEST_INSTALLATION_TOKEN }}
          EFR_TEST_APP_CLIENT_ID: ${{ secrets.EFR_TEST_APP_CLIENT_ID }}
          EFR_TEST_APP_INSTALLATION_ID: ${{ secrets.EFR_TEST_APP_INSTALLATION_ID }}
          EFR_TEST_APP_PRIVATE_KEY_PATH: ${{ matrix.needs-app-key && '/tmp/efr-test-app-key.pem' || '' }}
          EFR_TEST_FEATURES: ${{ matrix.features }}
        run: go test -tags=integration -count=1 -v -timeout=55m -coverpkg=./... -coverprofile=coverage.out ./test/integration/

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          flags: integration-${{ matrix.name }}
          skip_validation: ${{ matrix.name == 'Tart' }}
          token: ${{ secrets.CODECOV_TOKEN }}
