version: v2
modules:
  - path: proto
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  ignore_only:
    # WatchCommands streams AgentCommand messages. The name says what flows
    # over the stream, so it is kept instead of WatchCommandsResponse.
    RPC_RESPONSE_STANDARD_NAME:
      - proto/agent/v1/agent.proto
breaking:
  use:
    - FILE
