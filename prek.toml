[[repos]]
repo = "https://github.com/dnephin/pre-commit-golang"
rev = "v0.5.1"
hooks = [
  { id = "go-mod-tidy" },
  { id = "go-fmt" },
  { id = "go-imports", exclude = "^gen/" },
]

[[repos]]
repo = "https://github.com/golangci/golangci-lint"
rev = "v2.14.0"
hooks = [
  { id = "golangci-lint" },
]
